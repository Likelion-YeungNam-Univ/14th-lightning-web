name: Continuous Deployment

on:
  push:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p "${{ secrets.SERVER_SSH_PORT }}" \
            "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload build files
        run: |
          scp \
            -P "${{ secrets.SERVER_SSH_PORT }}" \
            -i ~/.ssh/id_rsa \
            -r dist/* \
            "${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:/var/www/14th-lightning-web/"

      - name: Validate and reload Nginx
        run: |
          ssh \
            -p "${{ secrets.SERVER_SSH_PORT }}" \
            -i ~/.ssh/id_rsa \
            "${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}" \
            "sudo nginx -t && sudo systemctl reload nginx"